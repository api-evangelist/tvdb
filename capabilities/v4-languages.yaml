naftiko: 1.0.0-alpha2
info:
  label: TVDB API V4 — Languages
  description: 'TVDB API V4 — Languages. 1 operations. Lead operation: Get All Languages. Self-contained Naftiko capability covering one TheTVDB business surface.'
  tags:
  - TheTVDB
  - Television
  - Languages
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
- namespace: env
  keys:
    TVDB_BEARER_TOKEN: TVDB_BEARER_TOKEN
capability:
  consumes:
  - type: http
    namespace: v4-languages
    baseUri: 'https://api4.thetvdb.com/v4'
    description: TVDB API V4 — Languages business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.TVDB_BEARER_TOKEN}}'
    resources:
    - name: languages
      path: /languages
      operations:
      - name: getAllLanguages
        method: GET
        description: TheTVDB Get All Languages
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: v4-languages-rest
    port: 8080
    description: REST adapter for TVDB API V4 — Languages. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/languages
      name: languages
      description: REST surface for languages.
      operations:
      - method: GET
        name: getAllLanguages
        description: TheTVDB Get All Languages
        call: v4-languages.getAllLanguages
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: v4-languages-mcp
    port: 9090
    transport: http
    description: MCP adapter for TVDB API V4 — Languages. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-languages
      description: TheTVDB Get All Languages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v4-languages.getAllLanguages
      outputParameters:
      - type: object
        mapping: $.

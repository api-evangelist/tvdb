naftiko: 1.0.0-alpha2
info:
  label: TVDB API V4 — People Types
  description: 'TVDB API V4 — People Types. 1 operations. Lead operation: Get All People Types. Self-contained Naftiko capability covering one TheTVDB business surface.'
  tags:
  - TheTVDB
  - Television
  - People Types
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
- namespace: env
  keys:
    TVDB_BEARER_TOKEN: TVDB_BEARER_TOKEN
capability:
  consumes:
  - type: http
    namespace: v4-people-types
    baseUri: 'https://api4.thetvdb.com/v4'
    description: TVDB API V4 — People Types business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.TVDB_BEARER_TOKEN}}'
    resources:
    - name: people-types
      path: /people/types
      operations:
      - name: getAllPeopleTypes
        method: GET
        description: TheTVDB Get All People Types
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: v4-people-types-rest
    port: 8080
    description: REST adapter for TVDB API V4 — People Types. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/people/types
      name: people-types
      description: REST surface for people-types.
      operations:
      - method: GET
        name: getAllPeopleTypes
        description: TheTVDB Get All People Types
        call: v4-people-types.getAllPeopleTypes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: v4-people-types-mcp
    port: 9090
    transport: http
    description: MCP adapter for TVDB API V4 — People Types. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-people-types
      description: TheTVDB Get All People Types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v4-people-types.getAllPeopleTypes
      outputParameters:
      - type: object
        mapping: $.

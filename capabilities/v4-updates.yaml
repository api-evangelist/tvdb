naftiko: 1.0.0-alpha2
info:
  label: TVDB API V4 — Updates
  description: 'TVDB API V4 — Updates. 1 operations. Lead operation: Updates. Self-contained Naftiko capability covering one TheTVDB business surface.'
  tags:
  - TheTVDB
  - Television
  - Updates
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
- namespace: env
  keys:
    TVDB_BEARER_TOKEN: TVDB_BEARER_TOKEN
capability:
  consumes:
  - type: http
    namespace: v4-updates
    baseUri: 'https://api4.thetvdb.com/v4'
    description: TVDB API V4 — Updates business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.TVDB_BEARER_TOKEN}}'
    resources:
    - name: updates
      path: /updates
      operations:
      - name: updates
        method: GET
        description: TheTVDB Updates
        inputParameters:
        - name: since
          in: query
          type: number
          required: true
          description: since parameter
        - name: type
          in: query
          type: string
          required: false
          description: type parameter
        - name: action
          in: query
          type: string
          required: false
          description: action parameter
        - name: page
          in: query
          type: number
          required: false
          description: name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: v4-updates-rest
    port: 8080
    description: REST adapter for TVDB API V4 — Updates. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/updates
      name: updates
      description: REST surface for updates.
      operations:
      - method: GET
        name: updates
        description: TheTVDB Updates
        call: v4-updates.updates
        with:
          since: rest.since
          type: rest.type
          action: rest.action
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: v4-updates-mcp
    port: 9090
    transport: http
    description: MCP adapter for TVDB API V4 — Updates. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: updates
      description: TheTVDB Updates
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v4-updates.updates
      with:
        since: tools.since
        type: tools.type
        action: tools.action
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.

naftiko: 1.0.0-alpha2
info:
  label: TVDB API V4 — Movie Statuses
  description: 'TVDB API V4 — Movie Statuses. 1 operations. Lead operation: Get All Movie Statuses. Self-contained Naftiko capability covering one TheTVDB business surface.'
  tags:
  - TheTVDB
  - Television
  - Movie Statuses
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
- namespace: env
  keys:
    TVDB_BEARER_TOKEN: TVDB_BEARER_TOKEN
capability:
  consumes:
  - type: http
    namespace: v4-movie-statuses
    baseUri: 'https://api4.thetvdb.com/v4'
    description: TVDB API V4 — Movie Statuses business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.TVDB_BEARER_TOKEN}}'
    resources:
    - name: movies-statuses
      path: /movies/statuses
      operations:
      - name: getAllMovieStatuses
        method: GET
        description: TheTVDB Get All Movie Statuses
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: v4-movie-statuses-rest
    port: 8080
    description: REST adapter for TVDB API V4 — Movie Statuses. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/movies/statuses
      name: movies-statuses
      description: REST surface for movies-statuses.
      operations:
      - method: GET
        name: getAllMovieStatuses
        description: TheTVDB Get All Movie Statuses
        call: v4-movie-statuses.getAllMovieStatuses
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: v4-movie-statuses-mcp
    port: 9090
    transport: http
    description: MCP adapter for TVDB API V4 — Movie Statuses. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-movie-statuses
      description: TheTVDB Get All Movie Statuses
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v4-movie-statuses.getAllMovieStatuses
      outputParameters:
      - type: object
        mapping: $.

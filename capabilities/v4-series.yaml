naftiko: 1.0.0-alpha2
info:
  label: TVDB API V4 — Series
  description: 'TVDB API V4 — Series. 10 operations. Lead operation: Get All Series. Self-contained Naftiko capability covering one TheTVDB business surface.'
  tags:
  - TheTVDB
  - Television
  - Series
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
- namespace: env
  keys:
    TVDB_BEARER_TOKEN: TVDB_BEARER_TOKEN
capability:
  consumes:
  - type: http
    namespace: v4-series
    baseUri: 'https://api4.thetvdb.com/v4'
    description: TVDB API V4 — Series business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.TVDB_BEARER_TOKEN}}'
    resources:
    - name: series
      path: /series
      operations:
      - name: getAllSeries
        method: GET
        description: TheTVDB Get All Series
        inputParameters:
        - name: page
          in: query
          type: number
          required: false
          description: page number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: series-id
      path: '/series/{id}'
      operations:
      - name: getSeriesBase
        method: GET
        description: TheTVDB Get Series Base
        inputParameters:
        - name: id
          in: path
          type: number
          required: true
          description: id
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: series-id-artworks
      path: '/series/{id}/artworks'
      operations:
      - name: getSeriesArtworks
        method: GET
        description: TheTVDB Get Series Artworks
        inputParameters:
        - name: id
          in: path
          type: number
          required: true
          description: id
        - name: lang
          in: query
          type: string
          required: false
          description: lang
        - name: type
          in: query
          type: integer
          required: false
          description: type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: series-id-nextaired
      path: '/series/{id}/nextAired'
      operations:
      - name: getSeriesNextAired
        method: GET
        description: TheTVDB Get Series Next Aired
        inputParameters:
        - name: id
          in: path
          type: number
          required: true
          description: id
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: series-id-extended
      path: '/series/{id}/extended'
      operations:
      - name: getSeriesExtended
        method: GET
        description: TheTVDB Get Series Extended
        inputParameters:
        - name: id
          in: path
          type: number
          required: true
          description: id
        - name: meta
          in: query
          type: string
          required: false
          description: meta
        - name: short
          in: query
          type: boolean
          required: false
          description: reduce the payload and returns the short version of this record without characters and artworks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: series-id-episodes-season-type
      path: '/series/{id}/episodes/{season-type}'
      operations:
      - name: getSeriesEpisodes
        method: GET
        description: TheTVDB Get Series Episodes
        inputParameters:
        - name: page
          in: query
          type: integer
          required: true
          description: page parameter
        - name: id
          in: path
          type: number
          required: true
          description: id
        - name: season-type
          in: path
          type: string
          required: true
          description: season-type
        - name: season
          in: query
          type: integer
          required: false
          description: season parameter
        - name: episodeNumber
          in: query
          type: integer
          required: false
          description: episodeNumber parameter
        - name: airDate
          in: query
          type: string
          required: false
          description: airDate of the episode, format is yyyy-mm-dd
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: series-id-episodes-season-type-lang
      path: '/series/{id}/episodes/{season-type}/{lang}'
      operations:
      - name: getSeriesSeasonEpisodesTranslated
        method: GET
        description: TheTVDB Get Series Season Episodes Translated
        inputParameters:
        - name: page
          in: query
          type: integer
          required: true
          description: page parameter
        - name: id
          in: path
          type: number
          required: true
          description: id
        - name: season-type
          in: path
          type: string
          required: true
          description: season-type
        - name: lang
          in: path
          type: string
          required: true
          description: lang parameter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: series-filter
      path: '/series/filter'
      operations:
      - name: getSeriesFilter
        method: GET
        description: TheTVDB Get Series Filter
        inputParameters:
        - name: company
          in: query
          type: number
          required: false
          description: production company
        - name: contentRating
          in: query
          type: number
          required: false
          description: content rating id base on a country
        - name: country
          in: query
          type: string
          required: true
          description: country of origin
        - name: genre
          in: query
          type: number
          required: false
          description: Genre id. This id can be found using **/genres** endpoint.
        - name: lang
          in: query
          type: string
          required: true
          description: original language
        - name: sort
          in: query
          type: string
          required: false
          description: sort by results
        - name: sortType
          in: query
          type: string
          required: false
          description: sort type ascending or descending
        - name: status
          in: query
          type: number
          required: false
          description: status
        - name: year
          in: query
          type: number
          required: false
          description: release year
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: series-slug-slug
      path: '/series/slug/{slug}'
      operations:
      - name: getSeriesBaseBySlug
        method: GET
        description: TheTVDB Get Series Base by Slug
        inputParameters:
        - name: slug
          in: path
          type: string
          required: true
          description: slug
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: series-id-translations-language
      path: '/series/{id}/translations/{language}'
      operations:
      - name: getSeriesTranslation
        method: GET
        description: TheTVDB Get Series Translation
        inputParameters:
        - name: id
          in: path
          type: number
          required: true
          description: id
        - name: language
          in: path
          type: string
          required: true
          description: language
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest

naftiko: 1.0.0-alpha2
info:
  label: TVDB API V4 — Episodes
  description: 'TVDB API V4 — Episodes. 4 operations. Lead operation: Get All Episodes. Self-contained Naftiko capability covering one TheTVDB business surface.'
  tags:
  - TheTVDB
  - Television
  - Episodes
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
- namespace: env
  keys:
    TVDB_BEARER_TOKEN: TVDB_BEARER_TOKEN
capability:
  consumes:
  - type: http
    namespace: v4-episodes
    baseUri: 'https://api4.thetvdb.com/v4'
    description: TVDB API V4 — Episodes business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.TVDB_BEARER_TOKEN}}'
    resources:
    - name: episodes
      path: '/episodes'
      operations:
      - name: getAllEpisodes
        method: GET
        description: TheTVDB Get All Episodes
        inputParameters:
        - name: page
          in: query
          type: number
          required: false
          description: page number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: episodes-id
      path: '/episodes/{id}'
      operations:
      - name: getEpisodeBase
        method: GET
        description: TheTVDB Get Episode Base
        inputParameters:
        - name: id
          in: path
          type: number
          required: true
          description: id
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: episodes-id-extended
      path: '/episodes/{id}/extended'
      operations:
      - name: getEpisodeExtended
        method: GET
        description: TheTVDB Get Episode Extended
        inputParameters:
        - name: id
          in: path
          type: number
          required: true
          description: id
        - name: meta
          in: query
          type: string
          required: false
          description: meta
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: episodes-id-translations-language
      path: '/episodes/{id}/translations/{language}'
      operations:
      - name: getEpisodeTranslation
        method: GET
        description: TheTVDB Get Episode Translation
        inputParameters:
        - name: id
          in: path
          type: number
          required: true
          description: id
        - name: language
          in: path
          type: string
          required: true
          description: language
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: v4-episodes-rest
    port: 8080
    description: REST adapter for TVDB API V4 — Episodes. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/episodes
      name: episodes
      description: REST surface for episodes.
      operations:
      - method: GET
        name: getAllEpisodes
        description: TheTVDB Get All Episodes
        call: v4-episodes.getAllEpisodes
        with:
          page: rest.page
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/episodes/{id}
      name: episodes-id
      description: REST surface for episodes-id.
      operations:
      - method: GET
        name: getEpisodeBase
        description: TheTVDB Get Episode Base
        call: v4-episodes.getEpisodeBase
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/episodes/{id}/extended
      name: episodes-id-extended
      description: REST surface for episodes-id-extended.
      operations:
      - method: GET
        name: getEpisodeExtended
        description: TheTVDB Get Episode Extended
        call: v4-episodes.getEpisodeExtended
        with:
          id: rest.id
          meta: rest.meta
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/episodes/{id}/translations/{language}
      name: episodes-id-translations-language
      description: REST surface for episodes-id-translations-language.
      operations:
      - method: GET
        name: getEpisodeTranslation
        description: TheTVDB Get Episode Translation
        call: v4-episodes.getEpisodeTranslation
        with:
          id: rest.id
          language: rest.language
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: v4-episodes-mcp
    port: 9090
    transport: http
    description: MCP adapter for TVDB API V4 — Episodes. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-episodes
      description: TheTVDB Get All Episodes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v4-episodes.getAllEpisodes
      with:
        page: tools.page
      outputParameters:
      - type: object
        mapping: $.
    - name: get-episode-base
      description: TheTVDB Get Episode Base
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v4-episodes.getEpisodeBase
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: get-episode-extended
      description: TheTVDB Get Episode Extended
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v4-episodes.getEpisodeExtended
      with:
        id: tools.id
        meta: tools.meta
      outputParameters:
      - type: object
        mapping: $.
    - name: get-episode-translation
      description: TheTVDB Get Episode Translation
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v4-episodes.getEpisodeTranslation
      with:
        id: tools.id
        language: tools.language
      outputParameters:
      - type: object
        mapping: $.

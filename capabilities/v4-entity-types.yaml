naftiko: 1.0.0-alpha2
info:
  label: TVDB API V4 — Entity Types
  description: 'TVDB API V4 — Entity Types. 1 operations. Lead operation: Get Entity Types. Self-contained Naftiko capability covering one TheTVDB business surface.'
  tags:
  - TheTVDB
  - Television
  - Entity Types
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
- namespace: env
  keys:
    TVDB_BEARER_TOKEN: TVDB_BEARER_TOKEN
capability:
  consumes:
  - type: http
    namespace: v4-entity-types
    baseUri: 'https://api4.thetvdb.com/v4'
    description: TVDB API V4 — Entity Types business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.TVDB_BEARER_TOKEN}}'
    resources:
    - name: entities
      path: '/entities'
      operations:
      - name: getEntityTypes
        method: GET
        description: TheTVDB Get Entity Types
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: v4-entity-types-rest
    port: 8080
    description: REST adapter for TVDB API V4 — Entity Types. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/entities
      name: entities
      description: REST surface for entities.
      operations:
      - method: GET
        name: getEntityTypes
        description: TheTVDB Get Entity Types
        call: v4-entity-types.getEntityTypes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: v4-entity-types-mcp
    port: 9090
    transport: http
    description: MCP adapter for TVDB API V4 — Entity Types. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-entity-types
      description: TheTVDB Get Entity Types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v4-entity-types.getEntityTypes
      outputParameters:
      - type: object
        mapping: $.

naftiko: 1.0.0-alpha2
info:
  label: TVDB API V4 — Genders
  description: 'TVDB API V4 — Genders. 1 operations. Lead operation: Get All Genders. Self-contained Naftiko capability covering one TheTVDB business surface.'
  tags:
  - TheTVDB
  - Television
  - Genders
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
- namespace: env
  keys:
    TVDB_BEARER_TOKEN: TVDB_BEARER_TOKEN
capability:
  consumes:
  - type: http
    namespace: v4-genders
    baseUri: 'https://api4.thetvdb.com/v4'
    description: TVDB API V4 — Genders business capability. Self-contained, no shared references.
    authentication:
      type: bearer
      token: '{{env.TVDB_BEARER_TOKEN}}'
    resources:
    - name: genders
      path: /genders
      operations:
      - name: getAllGenders
        method: GET
        description: TheTVDB Get All Genders
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: v4-genders-rest
    port: 8080
    description: REST adapter for TVDB API V4 — Genders. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/genders
      name: genders
      description: REST surface for genders.
      operations:
      - method: GET
        name: getAllGenders
        description: TheTVDB Get All Genders
        call: v4-genders.getAllGenders
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: v4-genders-mcp
    port: 9090
    transport: http
    description: MCP adapter for TVDB API V4 — Genders. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: get-genders
      description: TheTVDB Get All Genders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: v4-genders.getAllGenders
      outputParameters:
      - type: object
        mapping: $.

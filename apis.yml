description: >-
  TheTVDB is a community-driven television and movie metadata database founded in 2006. It supplies structured metadata
  about hundreds of thousands of TV series, movies, people, artwork, awards, and related entities to media center
  applications, streaming guides, and entertainment apps worldwide. TheTVDB v4 API uses JWT bearer authentication and
  exposes REST endpoints for series, movies, people, artwork, awards, episodes, genres, languages, countries, companies,
  content ratings, search, seasons, and updates. Commercial usage requires either a subscriber-supported API key (each
  end user must maintain a $12/year TheTVDB subscription) or a negotiated commercial license based on company revenue
  tier.

apis:
  - aid: tvdb:tvdb-v4-api
    name: TheTVDB v4 API
    description: >-
      The TheTVDB v4 API is a REST API providing structured metadata for TV series, movies, people, artwork, awards,
      episodes, seasons, companies, content ratings, genres, languages, countries, and search. It uses JWT bearer
      authentication acquired via the /login endpoint with an API key (and optional subscriber PIN). The base URL is
      https://api4.thetvdb.com/v4 and tokens are valid for one month. The API surface covers 67 operations across 29 tag
      groups including Series, Movies, People, Artwork, Awards, Episodes, Genres, Languages, Countries, Companies,
      Content Ratings, Search, Seasons, Lists, Favorites, Updates, and User Info. TheTVDB recommends maintaining a local
      database copy or caching proxy for high-volume usage and using the /updates endpoint to stay in sync.
